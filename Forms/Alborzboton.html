<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>form of alborz boton</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f5f5f5;
      padding: 30px;
      color: #333;
    }
    input, button {
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 16px;
      margin: 5px 0;
    }
    button {
      background-color: #007BFF;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 6px;
      cursor: pointer;
    }
    canvas {
      max-width: 90%;
      height: auto;
      margin-top: 20px;
      border: 1px solid #ccc;
    }
    .text-input {
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

  <h2>Image Text Overlay with Position in HTML</h2>

  <div id="textInputs">
    <div class="text-input">
    <label>
	Base Value (x):
      <input type="text" class="textValue" data-x="150" data-y="160" data-role="base" placeholder="Enter a number (x)">
    </label>
    </div>
    <div class="text-input">
      <label>
	base value 2:
      <input type="text" class="textValue" data-x="50" data-y="160" data-role="xdiv2" placeholder="Auto: x / 2" readonly>
      </label>
    </div>
    <div class="text-input">
      <label>
	text number 3:
      <input type="text" class="textValue" data-x="50" data-y="220" placeholder="Enter any text">
      </label>
    </div>
  </div>

  <button onclick="downloadImage()">Download Image</button>

  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const imageURL = 'https://raw.githubusercontent.com/sarvari1378/Auto_FORMS/refs/heads/main/Picturs/Alborz_BOTON.png';
    const uploadedImage = new Image();

    uploadedImage.crossOrigin = "Anonymous";
    uploadedImage.onload = function () {
      canvas.width = uploadedImage.width;
      canvas.height = uploadedImage.height;
      drawImage();
    };
    uploadedImage.src = imageURL;

    document.querySelectorAll('.textValue').forEach(input => {
      input.addEventListener('input', () => {
        if (input.dataset.role === 'base') {
          const xValue = parseFloat(input.value);
          const dependentInput = document.querySelector('.textValue[data-role="xdiv2"]');
          if (!isNaN(xValue)) {
            dependentInput.value = (xValue / 2).toFixed(2);
          } else {
            dependentInput.value = '';
          }
        }
        drawImage(); // Always update canvas
      });
    });

    function drawImage() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(uploadedImage, 0, 0, canvas.width, canvas.height);

      ctx.fillStyle = 'black';
      ctx.font = '30px Arial';

      document.querySelectorAll('.textValue').forEach(input => {
        const text = input.value;
        const x = parseFloat(input.dataset.x);
        const y = parseFloat(input.dataset.y);
        if (text !== '' && !isNaN(x) && !isNaN(y)) {
          ctx.fillText(text, x, y);
        }
      });
    }

    function downloadImage() {
      const link = document.createElement('a');
      link.download = 'image_with_text.png';
      link.href = canvas.toDataURL();
      link.click();
    }
  </script>

</body>
</html>
