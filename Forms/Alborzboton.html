  <script>
    function updateNetWeight() {
      const emptyInput = document.querySelector('[data-role="emptywight"]');
      const fullInput = document.querySelector('[data-role="fullwight"]');
      const netInput = document.querySelector('[data-role="purewight"]');
  
      const emptyWeight = parseFloat(emptyInput.value);
      const fullWeight = parseFloat(fullInput.value);
  
      if (!isNaN(fullWeight) && !isNaN(emptyWeight)) {
        netInput.value = fullWeight - emptyWeight;
      } else {
        netInput.value = '';
      }
    }
  
    // بروزرسانی خودکار وزن خالص وقتی وزن پر یا خالی تغییر کند
    document.querySelectorAll('[data-role="emptywight"], [data-role="fullwight"]').forEach(input => {
      input.addEventListener('input', updateNetWeight);
    });
  
    // بروزرسانی اولیه هنگام بارگذاری صفحه
    updateNetWeight();
  </script>

  <script>
    function updatetahvil() {
      const emptyInput = document.querySelector('[data-role="purewight"]');
      const fullInput = document.querySelector('[data-role="specialwight"]');
      const netInput = document.querySelector('[data-role="Tahvil"]');
  
      const emptyWeight = parseFloat(emptyInput.value);
      const fullWeight = parseFloat(fullInput.value);
  
      if (!isNaN(fullWeight) && !isNaN(emptyWeight)) {
        netInput.value = fullWeight / emptyWeight*10;

      } else {
        netInput.value = '';
      }
    }
  
    // بروزرسانی خودکار وزن خالص وقتی وزن پر یا خالی تغییر کند
    document.querySelectorAll('[data-role="emptywight"], [data-role="fullwight"]').forEach(input => {
      input.addEventListener('input', updatetahvil);
    });
  
    // بروزرسانی اولیه هنگام بارگذاری صفحه
    updatetahvil();
  </script>


  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const imageURL = 'https://raw.githubusercontent.com/sarvari1378/Auto_FORMS/refs/heads/main/Picturs/Alborz_BOTON.png';
    const uploadedImage = new Image();

    uploadedImage.crossOrigin = "Anonymous";
    uploadedImage.onload = function () {
      canvas.width = uploadedImage.width;
      canvas.height = uploadedImage.height;
      drawImage();
    };
    uploadedImage.src = imageURL;

    document.querySelectorAll('.textValue').forEach(input => {
      input.addEventListener('input', () => {
        if (input.dataset.role === 'base') {
          const xValue = parseFloat(input.value);
          const dependentInput = document.querySelector('.textValue[data-role="xdiv2"]');
          if (!isNaN(xValue)) {
            dependentInput.value = (xValue / 2).toFixed(2);
          } else {
            dependentInput.value = '';
          }
        }
        drawImage(); // Always update canvas
      });
    });

    function calculatepurewight() {



    }

    function drawImage() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(uploadedImage, 0, 0, canvas.width, canvas.height);

    document.querySelectorAll('.textValue').forEach(input => {
        const text = input.value;
        const x = parseFloat(input.dataset.x);
        const y = parseFloat(input.dataset.y);
        const dir = input.getAttribute('dir') || 'ltr'; // Default to 'ltr'

        if (text !== '' && !isNaN(x) && !isNaN(y)) {
        ctx.save(); // Save current state

        ctx.fillStyle = 'black';
        ctx.font = '30px Arial';
        ctx.direction = dir;

        // Adjust alignment based on direction
        ctx.textAlign = dir === 'rtl' ? 'right' : 'left';

        ctx.fillText(text, x, y);

        ctx.restore(); // Restore state after drawing
        }
    });
    }


    function downloadImage() {
      const link = document.createElement('a');
      link.download = 'image_with_text.png';
      link.href = canvas.toDataURL();
      link.click();
    }
  </script>
