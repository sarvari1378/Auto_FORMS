<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Image Text Overlay Tool</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f5f5f5;
      padding: 30px;
      color: #333;
    }
    input[type="text"], button {
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 16px;
      margin: 5px 0;
    }
    button {
      background-color: #007BFF;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 6px;
      cursor: pointer;
    }
    canvas {
      max-width: 90%;
      height: auto;
      margin-top: 20px;
      border: 1px solid #ccc;
    }
    .text-input {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 15px;
      background: #fff;
      padding: 15px;
      border-radius: 6px;
      box-shadow: 0 0 5px rgba(0,0,0,0.05);
    }
  </style>
</head>
<body>

  <h2>Live Text on Image</h2>

  <div id="textInputs">
    <div class="text-input">
      <input type="text" class="textValue" placeholder="Enter text">
    </div>
  </div>

  <button onclick="addTextInput()">Add More Text</button>
  <button onclick="downloadImage()">Download Image</button>

  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const imageURL = 'https://raw.githubusercontent.com/sarvari1378/Auto_FORMS/refs/heads/main/Picturs/Alborz_BOTON.png'; // SET YOUR IMAGE URL HERE
    let uploadedImage = new Image();
    let imageWidth = 0;
    let imageHeight = 0;

    // Predefined positions for each text box (X, Y)
    const positions = [
      { x: 50, y: 100 }, // Position for first text input
      { x: 50, y: 160 }, // Second input, if added
      { x: 50, y: 220 }  // Third input, etc.
    ];

    // Load fixed image
    uploadedImage.crossOrigin = "Anonymous"; // To avoid CORS if needed
    uploadedImage.onload = function () {
      imageWidth = uploadedImage.width;
      imageHeight = uploadedImage.height;
      canvas.width = imageWidth;
      canvas.height = imageHeight;
      drawImage();
    };
    uploadedImage.src = imageURL;

    function addTextInput() {
      const div = document.createElement('div');
      div.className = 'text-input';
      div.innerHTML = `<input type="text" class="textValue" placeholder="Enter text">`;
      document.getElementById('textInputs').appendChild(div);
      div.querySelector('.textValue').addEventListener('input', drawImage);
    }

    // Attach live listener to first input
    document.querySelectorAll('.textValue').forEach(input => {
      input.addEventListener('input', drawImage);
    });

    function drawImage() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(uploadedImage, 0, 0, imageWidth, imageHeight);

      const inputs = document.querySelectorAll('.textValue');
      ctx.fillStyle = 'black';
      ctx.font = '30px Arial';

      inputs.forEach((input, index) => {
        const text = input.value;
        const pos = positions[index] || { x: 50, y: 50 + index * 60 }; // fallback position
        if (text.trim()) {
          ctx.fillText(text, pos.x, pos.y);
        }
      });
    }

    function downloadImage() {
      const link = document.createElement('a');
      link.download = 'image_with_text.png';
      link.href = canvas.toDataURL();
      link.click();
    }
  </script>

</body>
</html>
